name: publish

# Publish to PyPI when a GitHub release is published. Uses PyPI trusted
# publishing (OpenID Connect), so no API token is stored in the repository.
# The release tag must match the version in pyproject.toml (e.g., v1.0.0).

on:
  release:
    types: [published]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match version $VERSION in pyproject.toml"
            exit 1
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -v
      - name: Build
        run: |
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mattis-bardeen/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
